name: Site CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Ensure SQLite is available for migration checks
        run: |
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends sqlite3
          fi
          sqlite3 --version

      - name: Check browser and worker source
        run: |
          npm run check:site
          npm run check:booking-functions

      - name: Check public contract and booking migrations
        run: |
          npm run check:public-truth
          npm run check:booking-migrations

      - name: Run all regression suites
        run: npm test

name = "aissisted-website"
compatibility_date = "2026-03-10"
pages_build_output_dir = "."

# Production configuration for the governed v2 offer.
# Checkout is enabled only for the validated live release, provider references,
# and production D1 binding recorded below.
# Do NOT put credentials in this file. Set secrets through Cloudflare Pages:
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   GOOGLE_CALENDAR_ID
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
#   GOOGLE_OAUTH_REFRESH_TOKEN
#   GRAIL_EMAIL_API_KEY
# Optional notification webhooks can also be set as secrets if used.

[vars]
PUBLIC_SITE_ORIGIN = "https://aissistedconsulting.com"
BOOKING_BUSINESS_TITLE = "AIssisted Consulting"
BOOKING_SUPPORT_EMAIL = "pj@aissistedconsulting.com"
BOOKING_CURRENCY = "usd"
BOOKING_TIMEZONE = "America/New_York"
BOOKING_HOLD_MINUTES = "30"
BOOKING_MINIMUM_LEAD_HOURS = "48"
BOOKING_LOOKAHEAD_DAYS = "21"
BOOKING_REQUIRE_GOOGLE_CALENDAR = "true"
AIC_EMAIL_PROVIDER = "resend"
AIC_EMAIL_FROM = "AIssisted Consulting <alerts@notify.aissistedconsulting.com>"
AIC_OWNER_ALERT_EMAIL = "pj@aissistedconsulting.com"
BOOKING_POLICY_VERSION = "2026-04-06"
BOOKING_RESERVATION_AMOUNT_CENTS = "22500"
STRIPE_BOOKING_PRICE_ID = "price_1TNNnxP3Zy09i3cc3B8yErot"
ACTIVE_BOOKING_RELEASE = "aissisted_booking_v2_2026_08_15"
BOOKING_CHECKOUT_ENABLED = "true"
FIT_CALL_REQUESTS_ENABLED = "true"
FIT_CALL_WEEKLY_CAPACITY = "2"
BOOKING_V2_STRIPE_PRODUCT_ID = "prod_V5BlbU0onBqZJm"
BOOKING_V2_STRIPE_PRICE_ID = "price_1U51O1P3Zy09i3ccga31AkfA"
BOOKING_V2_PAYMENT_METHOD_CONFIGURATION_ID = "pmc_1U51Q9P3Zy09i3ccSq8MwgKG"
STRIPE_EXPECTED_LIVEMODE = "true"
BOOKING_OPEN_SESSION_EXPIRY_ENABLED = "false"
BOOKING_MONITOR_MAX_GAP_MINUTES = "20"
BOOKING_CREATE_GOOGLE_CALENDAR_EVENT = "true"
GOOGLE_CALENDAR_SEND_UPDATES = "all"

[[d1_databases]]
binding = "BOOKING_DB"
database_name = "aissisted-booking"
database_id = "702b49f1-4e87-4390-8b36-3da67bc126ff"
preview_database_id = "702b49f1-4e87-4390-8b36-3da67bc126ff"

